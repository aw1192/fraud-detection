stages:

  clean:
    cmd:
      - uv run python scripts/data_clean.py
    deps:
      - config.yaml
      - scripts/data_clean.py
      - data/raw/creditcard.csv
    outs:
      - data/splits/

  # tuning on X_train/X_val, then the final fit on X and score on X_test
  train:
    cmd: uv run python -m fraud_detection.train
    deps:
      - config.yaml
      - data/splits/
      - src/fraud_detection/train.py
      - src/fraud_detection/base_learner.py
      - src/fraud_detection/meta_learner.py
    outs:
      - artifacts/oof_scores/
      - artifacts/scalers/
      - mlflow.db
      - mlruns/
